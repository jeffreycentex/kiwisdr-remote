name: Build

# Builds standalone apps with PyInstaller on each OS.
# - Manual run (Actions tab -> Build -> Run workflow) or any push of a v* tag.
# - A v* tag (e.g. v0.2.0) also creates a GitHub release with the archives attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest          # Apple silicon
            target: macos-arm64
          - os: ubuntu-22.04          # older glibc = runs on more distributions
            target: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6>=6.6" "numpy>=1.24" "sounddevice>=0.4.6" pyinstaller
          # optional: a failure only drops M4A recording / high-quality resampling
          python -m pip install "av>=12.0" || echo "::warning::PyAV not installed; build has no M4A/MP4 recording"
          if [ "$RUNNER_OS" != "Windows" ]; then
            python -m pip install "samplerate>=0.2.1" || echo "::warning::samplerate not installed; linear resampling"
          fi

      - name: Tests
        run: python -m unittest discover -s tests

      - name: PyInstaller
        run: pyinstaller --noconfirm kiwiremote.spec

      - name: Smoke test the frozen CLI
        run: |
          exe="dist/KiwiSDR Remote/kiwiremote-cli"
          [ "$RUNNER_OS" = "Windows" ] && exe="$exe.exe"
          "$exe" --headless --help
          "$exe" ctl --help

      - name: Archive
        id: archive
        run: |
          ver="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || ver="$(git rev-parse --short HEAD)"
          name="KiwiSDR-Remote-${ver}-${{ matrix.target }}"
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "../$name.zip" "KiwiSDR Remote" >/dev/null; file="$name.zip" ;;
            macOS)   ditto -c -k --keepParent "KiwiSDR Remote.app" "../$name.zip"; file="$name.zip" ;;
            Linux)   tar czf "../$name.tar.gz" "KiwiSDR Remote"; file="$name.tar.gz" ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.archive.outputs.file }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "KiwiSDR Remote $GITHUB_REF_NAME" --generate-notes
